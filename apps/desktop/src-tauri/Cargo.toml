[package]
name = "helicon"
version = "0.23.1"
description = "Helicon: desktop ADE for the Muse Code CLI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A webview does not reliably have the browser's Notification API, so the OS notifier comes from here.
tauri-plugin-notification = "2"
# Links in replies open in the default browser; the webview itself has nowhere to put them.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native hit areas over the drawn caption buttons, for Snap Layouts. Same version Tauri itself uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
